E1-09", "cam": "—", "pres": "—"}], "lines": [{"a": 0, "b": 70.0, "kind": "visual", "text": "🎬70"}, {"a": 70, "b": 71.0, "kind": "say", "text": "استنى."}, {"a": 71, "b": 73.3, "kind": "say", "text": "خلّينا نوقّف الصورة هنا."}, {"a": 73, "b": 76.3, "kind": "say", "text": "ريم بعتت كلمة واحدة. «تمام.»"}, {"a": 77, "b": 84.1, "kind": "say", "text": "وفي أربعين ثانية بس… نور اتضايقت، وزعلت، وبعتت رد فيه عتاب."}, {"a": 84, "b": 90.2, "kind": "say", "text": "وريم؟ بتقول إنها كانت بتقول «تمام»… عادي."}, {"a": 90, "b": 92.8, "kind": "say", "text": "طب المشكلة حصلت فين بالظبط؟"}, {"a": 93, "b": 94.4, "kind": "say", "text": "في الرسالة؟"}, {"a": 94, "b": 95.4, "kind": "say", "text": "في ريم؟"}, {"a": 96, "b": 103.1, "kind": "say", "text": "ولا في حاجة حصلت جوّه نور… في الأربعين ثانية دول؟"}, {"a": 103, "b": 112.0, "kind": "say", "text": "الرسالة كانت كلمة واحدة. بس الحكاية اللي اتكتبت في دماغ نور… كانت رواية."}, {"a": 112, "b": 119.2, "kind": "say", "text": "وقبل ما نكمّل… افتكر انت. آخر رسالة قلبت يومك."}, {"a": 119, "b": 124.0, "kind": "hold", "text": "⏳5"}, {"a": 124, "b": 129.2, "kind": "say", "text": "مش لازم تقولها لحد. بس خلّيها في بالك… هنحتاجها."}, {"a": 129, "b": 135.1, "kind": "say", "text": "الأربعين ثانية دول… هنرجعلهم كتير. لحد ما نفهمهم ثانية بثانية."}, {"a": 135, "b": 152.9, "kind": "say", "text": "في الرحلة دي هتلاحظ اللي بيحصل جوّاك… وتفرّق بين اللي حصل فعلًا والحكاية اللي اتحكت عنه… وتعمل مسافة قبل ما ترد… وتفهم اللي قدامك… وتقول اللي محتاجه… وتحمي حدودك."}, {"a": 153, "b": 160.5, "kind": "say", "text": "وهوريك كمان إزاي تفرّق بين حد أساء فهمك… وحد فاهمك كويس جدًا."}, {"a": 160, "b": 164.0, "kind": "visual", "text": "🎬4"}, {"a": 164, "b": 166.3, "kind": "say", "text": "تعالى نعمل تجربة صغيرة."}, {"a": 167, "b": 170.8, "kind": "say", "text": "نفس الرسالة… بالظبط. تلات مرات."}, {"a": 171, "b": 178.1, "kind": "say", "text": "نور الأولى قرت «تمام»… وقالت لنفسها: «زهقت منّي». حسّت بإيه؟ حزن."}, {"a": 178, "b": 185.5, "kind": "say", "text": "نور التانية قرت نفس الكلمة… وقالت: «هي بتستهبل عليّا؟» حسّت بإيه؟ غضب."}, {"a": 185, "b": 191.2, "kind": "say", "text": "ونور التالتة قالت: «أكيد مشغولة». وكمّلت يومها عادي."}, {"a": 191, "b": 195.8, "kind": "say", "text": "الرسالة واحدة. والمشاعر… تلاتة."}, {"a": 196, "b": 204.0, "kind": "say", "text": "يعني الفرق مش في الرسالة. الفرق في الجملة الصغيرة اللي بنقولها لنفسنا… واحنا بنقرا."}, {"a": 204, "b": 220.1, "kind": "say", "text": "وخد بالك من حاجة: أول تفسيرين… الاتنين بيخلّوا الرسالة عنّي أنا. «زهقت منّي»… «بتستهبل عليّا». ولما بنبقى متضايقين… بنميل ناخد تصرفات الناس بشكل شخصي."}, {"a": 220, "b": 233.1, "kind": "say", "text": "الفكرة دي مش جديدة. في كتاب اسمه «Mind Over Mood» فيه موقف شبهها: واحد بتكلّمه في حفلة… وعينه طول الوقت على حاجة ورا كتفك."}, {"a": 233, "b": 251.0, "kind": "say", "text": "لو قلت لنفسك «ده قليل الذوق»… غالبًا هتتضايق. لو قلت «أنا شكلي مملّ»… هتزعل. ولو قلت «ده شكله مكسوف»… ممكن حتى تتعاطف معاه. نفس الموقف… وتلات مشاعر."}, {"a": 251, "b": 252.4, "kind": "say", "text": "دلوقتي دورك."}, {"a": 253, "b": 258.7, "kind": "say", "text": "تخيّل مديرك بعتلك رسالة: «عايز أشوفك بكرة». بس كده."}, {"a": 258, "b": 263.2, "kind": "say", "text": "اكتب… أو قول في دماغك… تلات تفسيرات مختلفة."}, {"a": 264, "b": 274.0, "kind": "hold", "text": "⏳10"}, {"a": 274, "b": 281.1, "kind": "say", "text": "مثلًا: «هيرفدني». «عايز يديني مسؤولية جديدة». «عنده سؤال في الشغل وخلاص»."}, {"a": 281, "b": 289.5, "kind": "say", "text": "لاحظ: كل تفسير جاب معاه إحساس مختلف… والرسالة لسه زي ما هي."}, {"a": 289, "b": 300.8, "kind": "say", "text": "يعني في موقف نور ده بالذات… مش الرسالة اللي زعّلتها. اللي زعّلها… هو اللي قالته لنفسها عن الرسالة."}, {"a": 301, "b": 310.3, "kind": "say", "text": "طب لو فيه حاجة بتحصل في النص كده… بين الرسالة والزعل… هي إيه بالظبط؟ وليه ما شفناهاش؟"}, {"a": 310, "b": 317.0, "kind": "say", "text": "تعالى نبص على اللي حصل مع نور… كأنه خط مترو. أربع محطات."}, {"a": 317, "b": 319.4, "kind": "say", "text": "أول محطة: شافت."}, {"a": 320, "b": 323.3, "kind": "say", "text": "تاني محطة: حكت لنفسها حكاية."}, {"a": 323, "b": 325.4, "kind": "say", "text": "تالت محطة: حسّت."}, {"a": 325, "b": 328.9, "kind": "say", "text": "ورابع محطة: عملت."}, {"a": 329, "b": 342.1, "kind": "say", "text": "المشكلة في المحطة التانية. القطر بيعدّي عليها بسرعة جدًا… لدرجة إننا مش حاسين إنه وقف فيها أصلًا. بنحس إننا شفنا… وعلى طول حسّينا."}, {"a": 342, "b": 345.3, "kind": "say", "text": "تعالى نرجّع القطر لورا مع نور."}, {"a": 346, "b": 349.8, "kind": "say", "text": "عملت إيه؟ بعتت رد فيه عتاب."}, {"a": 350, "b": 353.8, "kind": "say", "text": "حسّت بإيه؟ زعل… وشوية غضب."}, {"a": 353, "b": 356.8, "kind": "say", "text": "حكت لنفسها إيه؟ «هي زهقانة منّي»."}, {"a": 357, "b": 366.2, "kind": "say", "text": "وشافت إيه؟ كلمة واحدة: «تمام»… بعد أربعين دقيقة. بس."}, {"a": 366, "b": 378.2, "kind": "say", "text": "والمحطات دي كمان مش ماشية في اتجاه واحد. اللي بتفكر فيه، واللي بتحسه، وجسمك، واللي بتعمله… كلهم ماسكين في بعض."}, {"a": 379, "b": 393.6, "kind": "say", "text": "بس خلّي بالك: ده مش معناه إن كل اللي بتحسه… مجرد حكاية في دماغك. ده معناه إن فيه محطة في النص… تستاهل نبصّلها."}, {"a": 393, "b": 406.2, "kind": "say", "text": "وأنا عارف إن فيه سؤال ممكن يكون في بالك دلوقتي: «طب لو حد ظلمني فعلًا… هل غضبي ده مجرد قصة في دماغي؟»"}, {"a": 406, "b": 424.8, "kind": "say", "text": "سؤال في الصميم. وبصراحة… هو من أهم الأسئلة في الرحلة دي كلها. ومش هرد عليه بجملة سريعة… لأن الإجابة السريعة هنا ممكن تظلم ناس كتير. هنرجعله… لما يبقى معانا الأدوات."}, {"a": 425, "b": 434.0, "kind": "say", "text": "دلوقتي خلّينا في المحطة التانية. بين اللي حصل… واللي حسّيته… فيه محطة اسمها: الحكاية."}, {"a": 434, "b": 442.1, "kind": "say", "text": "طب لو المحطة دي بتعدّي بالسرعة دي… أشوفها إزاي؟ محتاجين… كاميرا."}, {"a": 442, "b": 444.3, "kind": "say", "text": "بص على الاتنين دول."}, {"a": 445, "b": 453.5, "kind": "say", "text": "ده… كاميرا مراقبة. متعلّقة في ركن، ومش بتتكلم. بتسجّل اللي حصل… وخلاص."}, {"a": 453, "b": 463.0, "kind": "say", "text": "وده… معلّق كورة. ما شاء الله… مش بيسكت. «إيه ده؟! إيه الغباء ده؟!»"}, {"a": 463, "b": 471.5, "kind": "say", "text": "الكاميرا بتسجّل اللي أي حد واقف هناك كان هيشوفه. المعلّق… بيقولك رأيه. والاتنين جوّانا."}, {"a": 472, "b": 478.7, "kind": "say", "text": "يلا نلعب. هقولك جملة… وانت تقرر: كاميرا؟ ولا معلّق؟"}, {"a": 478, "b": 487.0, "kind": "say", "text": "«ردّت بعد أربعين دقيقة… بكلمة واحدة». كاميرا. أي حد يقدر يشوف ده."}, {"a": 487, "b": 491.3, "kind": "say", "text": "«هي مش مهتمة». معلّق."}, {"a": 492, "b": 496.3, "kind": "say", "text": "«المدير رفع صوته». كاميرا."}, {"a": 496, "b": 499.9, "kind": "say", "text": "«المدير بيكرهني». معلّق."}, {"a": 500, "b": 505.7, "kind": "say", "text": "«جوزي بصّ في الموبايل وأنا بتكلم». كاميرا."}, {"a": 505, "b": 511.3, "kind": "say", "text": "«جوزي مش فارق معاه». معلّق."}, {"a": 512, "b": 524.7, "kind": "say", "text": "خدت بالك؟ جملة المعلّق دايمًا فيها حاجة… محدش يقدر يصوّرها. الكاميرا تقدر تصوّر الموبايل في إيده. بس ماتقدرش تصوّر «مش فارق معاه»."}, {"a": 524, "b": 540.9, "kind": "say", "text": "فيه اختبار بسيط: الحاجة اللي بتسمّيها «حقيقة»… تقدر تشوفها أو تسمعها؟ لو اتنين واقفين في نفس المكان… هيشوفوها زي بعض؟ يبقى كاميرا. لو ممكن يختلفوا عليها… يبقى معلّق."}, {"a": 541, "b": 552.3, "kind": "say", "text": "وعلى فكرة… المعلّق مش عدوّك. ساعات بيبقى عنده حق. بس لازم تعرف إن ده صوته هو… مش صوت الكاميرا."}, {"a": 553, "b": 562.5, "kind": "say", "text": "والكاميرا مش بتمنعك إنك تحس. هي بس بتخلّيك تعرف… انت بتحس على إيه بالظبط."}, {"a": 562, "b": 567.2, "kind": "say", "text": "ارجع للرسالة اللي افتكرتها في الأول. اللي قلبت يومك."}, {"a": 567, "b": 575.4, "kind": "say", "text": "واسأل نفسك سؤال واحد: إيه اللي كان بيعدّي في دماغي… قبل ما أحس كده بثانية؟"}, {"a": 576, "b": 584.0, "kind": "hold", "text": "⏳8"}, {"a": 584, "b": 589.7, "kind": "say", "text": "وبعدين قسّمها نصّين: الكاميرا سجّلت إيه؟ والمعلّق قال إيه؟"}, {"a": 590, "b": 598.0, "kind": "hold", "text": "⏳8"}, {"a": 598, "b": 600.3, "kind": "say", "text": "الكاميرا بتسجّل… والمعلّق بيحكم."}, {"a": 600, "b": 610.8, "kind": "say", "text": "في قصة نور… المعلّق قال حاجات كتير. «تمام بس؟»… «زهقانة منّي»… «مش عايزة تيجي»… «آخر مرة برضه»…"}, {"a": 611, "b": 620.5, "kind": "say", "text": "بس لو سألنا نور: «ولو هي زهقانة منك فعلًا… ده معناه إيه عنك انتي؟»"}, {"a": 620, "b": 627.2, "kind": "say", "text": "هتلاقي تحتهم جملة… أسخن من الكل: «أنا تقيلة عليها»."}, {"a": 627, "b": 638.7, "kind": "say", "text": "زي الأسلاك. فيه أسلاك كتير… بس فيه سلك واحد هو اللي فيه الكهربا. دي الفكرة اللي شايلة أكبر حتة من الزعل."}, {"a": 639, "b": 647.5, "kind": "say", "text": "طب تعالى نعمل حاجة غريبة شوية. نحط الفكرة دي… في محكمة. ونور هي القاضية."}, {"a": 648, "b": 656.0, "kind": "say", "text": "والقاعدة الوحيدة: الفكرة هنا متّهمة… مش محكوم عليها. فرضية… لسه بنشوف أدلّتها."}, {"a": 656, "b": 662.6, "kind": "say", "text": "أدلة مع: «ردّت بكلمة واحدة». «وآخر مرة برضه اتأخرت في الرد»."}, {"a": 662, "b": 678.2, "kind": "say", "text": "أدلة ضد: «هي اللي اقترحت إننا نسافر… الشهر اللي فات». «بتبعتلي كل يوم». «وهي أصلًا بترد مختصر كده… لما بتبقى في الشغل»."}, {"a": 678, "b": 690.7, "kind": "say", "text": "لاحظت حاجة؟ أدلة «مع» جت لوحدها. أدلة «ضد»… احتاجت مجهود. وده طبيعي: واحنا متضايقين… بنشوف اللي يأكّد إحساسنا أسهل بكتير."}, {"a": 691, "b": 703.3, "kind": "say", "text": "فيه سؤال بيساعد جدًا هنا: لو صاحبتك هي اللي قالتلك «أنا تقيلة على ريم»… كنت هتقولّها إيه؟"}, {"a": 703, "b": 716.6, "kind": "say", "text": "ومش شرط المحكمة تحكم ضد الفكرة. ساعات الأدلة بتقول إن الفكرة صح. وده برضه مهم نعرفه. الهدف مش إننا نكسب القضية… الهدف إننا نشوف."}, {"a": 717, "b": 725.5, "kind": "say", "text": "جرّب انت: خُد الفكرة اللي لقيتها من شوية. وهات لها دليلين مع… ودليلين ضد."}, {"a": 725, "b": 733.0, "kind": "hold", "text": "⏳8"}, {"a": 733, "b": 738.8, "kind": "say", "text": "الفكرة السخنة… فرضية. مش حكم نهائي."}, {"a": 739, "b": 746.5, "kind": "say", "text": "طب لو الفكرة دي مش مظبوطة… نحط مكانها إيه؟ «كله تمام، وهي بتموت فيّا»؟"}, {"a": 747, "b": 748.9, "kind": "say", "text": "خلّينا نجرّب نظارات."}, {"a": 749, "b": 754.7, "kind": "say", "text": "النظارة السودا: «هي زهقت منّي». كل حاجة شكلها وحش."}, {"a": 754, "b": 763.5, "kind": "say", "text": "طب نقلعها… ونلبس الوردي؟ «ريم أكيد بتحبني جدًا، ومفيش أي مشكلة خالص». مريحة… صح؟"}, {"a": 764, "b": 773.8, "kind": "say", "text": "بس النظارة دي كمان بتخبّي حاجات. مش شايفة إن ريم فعلًا ردّت بكلمة… ولا إن نور فعلًا اتضايقت."}, {"a": 774, "b": 785.2, "kind": "say", "text": "ونفس الكتاب اللي حكينا منه مثال الحفلة بيقول حاجة مهمة: التفكير الإيجابي بيتجاهل المعلومات السلبية… وممكن يضر زي التفكير السلبي بالظبط."}, {"a": 785, "b": 796.9, "kind": "say", "text": "النظارة الشفافة بقى… مش بتلوّن. بتوريك كل اللي على الترابيزة. الحلو… والوحش… واللي لسه مش عارفينه."}, {"a": 797, "b": 802.3, "kind": "say", "text": "يعني مش «فكّر إيجابي»… «فكّر كامل»."}, {"a": 802, "b": 813.2, "kind": "say", "text": "والهدف كمان مش إنك ماتحسّش حاجة. الهدف إن اللي تحسه… يبقى على قد الموقف كله… مش على قد حتة منه."}, {"a": 813, "b": 818.2, "kind": "say", "text": "فيه قالب بسيط بيعمل كده: «صحيح إن… وكمان…»"}, {"a": 818, "b": 830.8, "kind": "say", "text": "نور هتجرّبه: «صحيح إن ريم ردّت بكلمة واحدة… وكمان هي بترد كده لما بتبقى مشغولة. أسألها… بدل ما أفترض»."}, {"a": 831, "b": 838.1, "kind": "say", "text": "دورك: خُد الفكرة بتاعتك… وحطّها في القالب. «صحيح إن… وكمان…»"}, {"a": 838, "b": 848.0, "kind": "hold", "text": "⏳10"}, {"a": 848, "b": 855.6, "kind": "say", "text": "تعالى نرجّع الشريط… للثانية الأربعين. قبل ما نور تدوس «إرسال»."}, {"a": 856, "b": 871.6, "kind": "say", "text": "لاحظ إن الرقم ما نزلش لصفر. لسه فيه شوية قلق… وده طبيعي. بس دلوقتي… ده قلق على قد الموقف. مش قلق واحدة بتكتب رواية."}, {"a": 872, "b": 878.0, "kind": "visual", "text": "🎬6"}, {"a": 878, "b": 884.7, "kind": "say", "text": "يبقى نرجع للسؤال اللي بدأنا بيه: المشكلة حصلت فين؟"}, {"a": 884, "b": 900.9, "kind": "say", "text": "مش في الرسالة. ومش بالضرورة في ريم. المشكلة حصلت في المحطة اللي في النص… في الحكاية اللي نور حكتها لنفسها في أربعين ثانية… وصدّقتها من غير ما تبصّلها."}, {"a": 901, "b": 909.9, "kind": "say", "text": "والكاميرا اللي عملناها دي… شغالة حلو قوي مع رسالة زي «تمام». طب لو المشهد… أصعب بكتير؟"}, {"a": 910, "b": 913.0, "kind": "visual", "text": "🎬3"}, {"a": 913, "b": 918.7, "kind": "say", "text": "فيه فيلم مصري قديم… «الزوجة التانية». سنة سبعة وستين."}, {"a": 919, "b": 921.8, "kind": "say", "text": "فيه عمدة… اسمه عتمان."}, {"a": 922, "b": 933.0, "kind": "say", "text": "والعمدة ده بيجبر راجل فقير… إنه يطلّق مراته. إزاي؟ بيهدده إنه يلفّقله تهمة."}, {"a": 932, "b": 937.7, "kind": "say", "text": "تعالى نطبّق الكاميرا هنا. الكاميرا تسجّل إيه؟"}, {"a": 938, "b": 941.8, "kind": "say", "text": "تهديد بتلفيق تهمة. وبعده… طلاق."}, {"a": 942, "b": 949.6, "kind": "say", "text": "والمعلّق؟ المعلّق عنده كلام كتير: «شرير»… «مريض»… وأوصاف أتقل من كده."}, {"a": 950, "b": 959.0, "kind": "say", "text": "بس احنا مش محتاجين نشخّص حد… عشان نشوف اللي حصل. خلّينا في الكاميرا."}, {"a": 959, "b": 962.8, "kind": "say", "text": "ولاحظ حاجة مهمة جدًا."}, {"a": 962, "b": 967.7, "kind": "say", "text": "المرة دي… الكاميرا نفسها بتسجّل أذى حقيقي."}, {"a": 968, "b": 975.5, "kind": "say", "text": "في «تمام»… أغلب الوجع كان في الحكاية. هنا… الوجع في الصورة نفسها."}, {"a": 976, "b": 987.3, "kind": "say", "text": "حتى الكتب اللي بتقولك «افصل الحقيقة عن الحكاية»… بتقول بوضوح إن فيه ظلم حقيقي. وإنه ساعتها… حقيقة، مش حكاية."}, {"a": 987, "b": 996.0, "kind": "say", "text": "فاكر سؤال «لو حد ظلمني فعلًا»؟ لسه ما جاوبناهوش. بس عرفنا أول حاجة:"}, {"a": 996, "b": 1004.1, "kind": "say", "text": "الكاميرا مش بتلغي الأذى. بتوريهولك… من غير زيادة… ولا نقصان."}, {"a": 1004, "b": 1013.3, "kind": "say", "text": "وهنرجع للمشهد ده تاني. لأن فيه حاجة فيه لسه ما اتقالتش: ليه كان فعّال… بالشكل المخيف ده."}, {"a": 1013, "b": 1020.5, "kind": "say", "text": "نور… كان عندها أربعين ثانية. وكانت قاعدة في بيتها… والموبايل في إيدها."}, {"a": 1021, "b": 1026.7, "kind": "say", "text": "بس فيه مواقف… ما بتدّيكش أربعين ثانية."}, {"a": 1026, "b": 1029.8, "kind": "say", "text": "كريم… كان في اجتماع. قدّام تمانية."}, {"a": 1030, "b": 1034.0, "kind": "visual", "text": "🎬4"}], "extraSrc": [{"a": 553, "text": "Mind Over Mood · p.72–73 · Crucial Conversations · p.105 · NVC · Ch.3"}]};
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let t = 0, playing = false, last = null;

const at = (arr, x) => arr.find(o => x >= o.a && x < o.b);

function presenterLayer(cam){
  const scale = /XC/.test(cam) ? 1.9 : /C/.test(cam) && !/—/.test(cam) ? 1.45 : /Punch/.test(cam) ? 1.25 : 1;
  return `<div class="presenter"><div class="sil" style="transform:scale(${scale}) translateY(${(scale-1)*18}%)"></div><div class="lbl">المقدم · ${esc(cam)}</div></div>`;
}
const therm = v => `<div class="therm"><b style="height:${v}%"></b></div>`;

function renderSlide(s, t){
  const lt = t - s.a;
  switch(s.k){
    case "black": return `<div class="layer" style="background:#000"><div class="big s" style="color:#333">🔔</div></div>`;
    case "chat": {
      const cnt = s.counter ? `<div class="counter">00:${String(Math.min(40, Math.floor(t - s.counter[0]))).padStart(2,"0")}</div>` : "";
      let msgs = s.msgs.slice();
      let typing = "";
      if (s.typing && t < 60) { msgs = msgs.slice(0,1); typing = `<div class="typing">✍️ بتكتب… وبتمسح</div>`; }
      if (s.freeze && t < 65) { msgs = msgs.slice(0,2); typing = t >= 62 ? `<div class="typing" style="align-self:flex-end">ريم بتكتب…</div>` : ""; }
      const frozen = s.freeze && t >= s.freeze ? " frozen" : "";
      return `<div class="layer${frozen}">${cnt}<div class="phone"><div class="who">ريم</div>${s.top?`<div class="top">${esc(s.top)}</div>`:""}<div class="msgs">${msgs.map(m=>`<div class="b ${m[0]}">${esc(m[1])}<i>${m[2]} م${m[0]=="me"?" ✓✓":""}</i></div>`).join("")}${typing}</div></div></div>`;
    }
    case "inner": {
      const n = Math.min(s.thoughts.length, Math.floor(lt / 5) + 1);
      const pos = [[12,20,3.6],[60,28,3.2],[20,62,3.9],[58,70,3.4]];
      const reps = Math.min(5, Math.floor(lt / 4));
      return `<div class="layer"><div class="counter">00:${String(Math.min(40, Math.floor(t - s.counter[0]))).padStart(2,"0")}</div>
        <div class="big" style="transform:scale(${1 + reps*0.05})">«تمام.»</div>
        <div class="thoughts">${s.thoughts.slice(0,n).map((x,i)=>`<span style="inset-inline-start:${pos[i][0]}%;top:${pos[i][1]}%;font-size:${pos[i][2]}cqw">${esc(x)}</span>`).join("")}</div></div>`;
    }
    case "question": return `<div class="layer"><div><div class="big ${t>=s.qa?"":"s"}" style="opacity:${t>=s.qa?1:.25}">${esc(s.q)}</div><div class="chips">${s.chips.filter(c=>t>=c[1]).map(c=>`<span class="${c[2]}">${esc(c[0])}</span>`).join("")}</div></div></div>`;
    case "split3": return `<div class="layer"><div style="display:grid;gap:2cqw;justify-items:center;width:100%"><div class="tri">${s.panels.map(p=>`<div>${p[1]&&p[2]?therm(+p[2]):""}${p[2]=="sil"?`<div class="sil"></div>`:`<div class="t ${p[2]=="red"?"red":""}">${esc(p[0])}</div>`}${p[1]?`<div class="v">${esc(p[1])}</div>`:""}</div>`).join("")}</div>${s.big?`<div class="big s gold">${esc(s.big)}</div>`:""}</div></div>`;
    case "prompt": return `<div class="layer" style="background:#0a0f13"><div style="text-align:center;display:grid;gap:3cqw"><div style="font-size:9cqw">${s.icon}</div><div class="big s">${esc(s.text)}</div></div></div>`;
    case "icons": return `<div class="layer" style="place-items:end center;padding-bottom:12%"><div class="row" style="background:#0008;padding:1.4cqw 3cqw;border-radius:1cqw;font-size:3.4cqw;gap:3.4cqw">${s.items.slice(0, Math.min(6, Math.floor(lt/3)+1)).map(x=>`<span>${x}</span>`).join("")}</div></div>`;
    case "shadow": return `<div class="layer" style="place-items:center end;padding-inline-end:10%"><div style="position:relative;filter:brightness(.5)"><div style="position:absolute;inset-inline:22%;top:-1.2cqw;height:2.6cqw;border-radius:50%;background:#3a4650;z-index:1"></div><div class="sil" style="transform:scale(1.3)"></div></div></div>`;
    case "title": return `<div class="layer"><div class="titlecard"><div class="s">${esc(s.series)}</div><div class="e">${esc(s.ep)}</div></div></div>`;
    case "big": return `<div class="layer" ${s.ovl?'style="place-items:end center;padding-bottom:14%"':""}><div style="display:grid;gap:2cqw;justify-items:center;${s.ovl?"background:#000a;padding:1.4cqw 3cqw;border-radius:1cqw":""}"><div class="big ${s.small?"s":""} ${s.gold?"gold":""}">${esc(s.text)}</div>${s.sub?`<div style="font-size:2.4cqw;color:var(--dim)">${esc(s.sub)}</div>`:""}${s.temp?`<div class="row">${therm(t < s.b-6 ? s.temp[0] : s.temp[1])}<span style="font-size:2.2cqw">ضيق ${t < s.b-6 ? s.temp[0] : s.temp[1]}</span></div>`:""}</div></div>`;
    case "list": return `<div class="layer"><div style="display:grid;gap:1.6cqw;justify-items:center"><div style="font-size:2.4cqw;color:var(--dim)">${esc(s.head)}</div>${s.items.slice(0, Math.floor(lt/8)+1).map(x=>`<div class="gcard" style="font-size:3cqw">${esc(x)}</div>`).join("")}</div></div>`;
    case "exercise": {
      const filled = t >= s.fill;
      return `<div class="layer"><div style="display:grid;gap:2cqw;justify-items:center;width:80%"><div class="b them" style="font-size:2.6cqw;align-self:center">${esc(s.chat)}<i>المدير</i></div>${lt>5?`<div class="big s gold">${esc(s.prompt)}</div><div class="cols2" style="grid-template-columns:repeat(3,1fr)">${s.boxes.map(b=>`<div style="height:8cqw;place-items:center;padding:0">${filled?esc(b):"▍"}</div>`).join("")}</div>`:""}</div></div>`;
    }
    case "metro": {
      const lit = s.rewind ? Math.min(4, Math.floor(lt/5)+1) : Math.min(4, Math.floor(lt/3)+1);
      const st = s.rewind ? s.stations.slice().map((x,i)=>({x,i})) : s.stations.map((x,i)=>({x,i}));
      return `<div class="layer" ${s.ovl?'style="place-items:end center;padding-bottom:16%"':""}><div class="metro" ${s.ovl?'style="background:#000a;padding:2cqw;border-radius:1cqw"':""}>${st.map(({x,i})=>{
        const on = s.rewind ? i >= 4 - lit : i < lit;
        const cls = ["st", on?"lit":"", s.glow===i?"gl":"", s.blur===i && lt>18?"bl":""].join(" ");
        return `<div class="${cls}"><i></i><span class="${s.glow===i?"gold":""}">${esc(x)}</span></div>`;}).join("")}</div>${s.rewind?`<div class="cardtitle">◀◀ القطر راجع لورا</div>`:""}</div>`;
    }
    case "five": return `<div class="layer"><div style="display:grid;gap:3cqw;justify-items:center;width:100%"><div class="pent">${s.items.map(x=>`<span>${esc(x)}</span>`).join("")}</div><div style="font-size:2.2cqw;color:var(--dim)">↔ كلهم ماسكين في بعض ↔</div></div></div>`;
    case "card": return `<div class="layer" style="background:#0009"><div class="card">${esc(s.text)}</div></div>`;
    case "camcom": return `<div class="layer"><div class="cc"><div class="c1"><div class="ic">🎥</div><div class="nm green">كاميرا</div><div style="font-size:1.8cqw;color:var(--dim)">بتسجّل… وخلاص</div></div><div class="c2"><div class="ic">🎙</div><div class="nm gold">معلّق</div><div style="font-size:1.8cqw;color:var(--dim)">«إيه الغباء ده؟!»</div></div></div></div>`;
    case "game": {
      let i = s.cards.findIndex((c,j) => t >= c[2] && (j == s.cards.length-1 || t < s.cards[j+1][2]));
      if (i < 0) return `<div class="layer"><div class="big s">يلا نلعب: كاميرا؟ ولا معلّق؟</div></div>`;
      const c = s.cards[i], stamped = t >= c[2] + 3;
      return `<div class="layer"><div style="display:grid;justify-items:center"><div class="gcard">«${esc(c[0])}»${stamped?`<div class="stamp ${c[1]=="cam"?"green":"gold"}">${c[1]=="cam"?"🎥 كاميرا":"🎙 معلّق"}</div>`:`<div class="stamp" style="color:var(--dim)">…</div>`}</div><div class="dots">${s.cards.map((x,j)=>`<i class="${j<i || (j==i&&stamped) ? x[1] : ""}"></i>`).join("")}</div></div></div>`;
    }
    case "blur": return `<div class="layer"><div class="lens"><div class="sharp">🎥<br>${esc(s.sharp)}</div><div class="soft">🎥<br>${esc(s.soft)}</div></div></div>`;
    case "twocol": return `<div class="layer" style="background:#0a0f13"><div style="display:grid;justify-items:center;width:100%"><div class="big s">${esc(s.prompt)}</div>${lt>20?`<div class="cols2">${s.cols.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`:""}</div></div>`;
    case "wires": {
      const hot = t >= s.hotAt;
      return `<div class="layer"><div class="wires">${s.wires.map(w=>`<div class="wire" style="${hot?"opacity:.4":""}">${esc(w)}</div>`).join("")}${hot?`<div class="wire hot">${esc(s.hot)}</div>`:""}</div>${hot?`<div style="position:absolute;inset-inline-end:5%;top:18%" class="row">${therm(s.temp)}<span style="font-size:1.8cqw">ضيق ${s.temp}</span></div>`:""}</div>`;
    }
    case "court": {
      if (s.empty) return `<div class="layer"><div style="display:grid;gap:2cqw;justify-items:center;width:100%"><div class="court"><div class="pan"><h4>مع</h4><em></em><em></em></div><div class="cage"><b>؟</b></div><div class="pan"><h4>ضد</h4><em></em><em></em></div></div><div class="big s gold">${esc(s.label)}</div></div></div>`;
      const pro = s.pro.filter(x=>t>=x[1]), con = s.con.filter(x=>t>=x[1]);
      const tilt = Math.max(-6, Math.min(6, (con.length - pro.length) * 2));
      return `<div class="layer"><div class="court"><div class="pan" style="transform:translateY(${-tilt}cqw)"><h4>مع</h4>${pro.map(x=>`<span>${esc(x[0])}</span>`).join("")}</div><div class="cage"><small>متّهمة… مش محكوم عليها</small><b>أنا تقيلة عليها</b></div><div class="pan" style="transform:translateY(${tilt}cqw)"><h4>ضد</h4>${con.map(x=>`<span>${esc(x[0])}</span>`).join("")}</div></div></div>`;
    }
    case "glasses": {
      let ph = s.phases[0]; for (const p of s.phases) if (t >= p[0]) ph = p;
      return `<div class="layer"><div class="glass"><div class="lensbox ${ph[1]}">${esc(ph[2])}</div><div style="font-size:2.2cqw;color:var(--dim)">${ph[1]=="dark"?"النظارة السودا":ph[1]=="rose"?"النظارة الوردي":"النظارة الشفافة"}</div></div></div>`;
    }
    case "swap": return `<div class="layer"><div class="big">فكّر <span class="strike">إيجابي</span> ← <span class="gold">فكّر كامل</span></div></div>`;
    case "template": {
      const cleared = t >= s.clearAt, n = cleared ? 0 : Math.min(2, Math.floor(lt/5)+ (lt>5?1:0));
      return `<div class="layer"><div class="tpl"><div><b>صحيح إن…</b> ${n>0?esc(s.noor[0].replace("صحيح إن ","")):""}</div><div><b>وكمان…</b> ${n>1?esc(s.noor[1].replace("وكمان ","")):""}</div>${cleared?`<p class="gold" style="text-align:center;font-size:2.2cqw;margin:0">دورك ✍️</p>`:""}</div></div>`;
    }
    case "rewind": {
      const isNew = t >= s.newAt, v = lt > 8 ? s.temp[1] : s.temp[0];
      return `<div class="layer"><div class="counter" style="color:var(--gold)">00:40</div><div class="row"><div class="phone" style="height:78%;width:30cqw"><div class="who">ريم</div><div class="msgs"><div class="b them">تمام.<i>7:52 م</i></div>${isNew?`<div class="b me">تمام يعني ماشي؟ ولا مشغولة؟ 😄<i>7:53 م ✓✓</i></div>`:`<div class="typing">${lt<3?"◀◀ الشريط بيرجع…":"الثانية 40 — قبل «إرسال»"}</div>`}</div></div><div style="display:grid;gap:1cqw;justify-items:center">${therm(v)}<span style="font-size:2cqw">ضيق ${v}</span></div></div></div>`;
    }
    case "ink": return `<div class="layer"><div class="ink"></div><div class="cardtitle">${esc(s.title)}</div><div class="row" style="position:relative;align-items:flex-end;gap:6cqw"><div class="sil" style="transform:scale(2.2);filter:brightness(.55)"></div><div class="sil" style="transform:scale(1.1);filter:brightness(.4)"></div></div><div style="position:absolute;bottom:14%;font-size:1.5cqw;color:var(--dim)">رسم رمزي — لا يشبه ممثلًا ولا يعيد لقطة من الفيلم</div></div>`;
    case "columns": {
      const st = t >= s.strikeAt;
      return `<div class="layer"><div class="cc"><div class="c1"><div class="nm">🎥</div><div class="t green" style="font-family:var(--f-display);font-size:2.8cqw">تهديد بتلفيق تهمة ← طلاق</div></div><div class="c2"><div class="nm">🎙</div><div style="font-size:2.8cqw" class="${st?"strike":""}">«شرير» · «مريض»</div></div></div></div>`;
    }
    case "harm": return `<div class="layer"><div style="display:grid;gap:2.4cqw;justify-items:center"><div class="harmcol on"><div class="nm">🎥</div><div class="t">تهديد بتلفيق تهمة ← طلاق</div><div style="font-size:2.6cqw">أذى حقيقي</div></div>${t>=s.factAt?`<div class="big s">حقيقة، مش حكاية</div>`:""}</div></div>`;
    case "couch": return `<div class="layer" style="background:radial-gradient(ellipse at 50% 60%,#3a2c20,#12100d 70%)"><div class="row" style="align-items:flex-end"><div class="sil" style="transform:scale(1.4);filter:sepia(.6)"></div><div style="font-size:3cqw;opacity:.6">📱</div></div></div>`;
    case "meeting": return `<div class="layer" style="background:#0b1014"><div style="display:grid;gap:2cqw;justify-items:center"><div class="sil" style="transform:scale(1.2)"></div><div class="row" style="gap:1.4cqw">${"<div class='sil' style='width:5cqw;height:7cqw'></div>".repeat(8)}</div></div></div>`;
  }
  return "";
}

function render(){
  const slide = at(D.slides, t);
  const seg = at(D.segs, t) || {};
  const line = at(D.lines, t);
  const sc = at(D.scenes, t) || D.scenes[D.scenes.length-1];
  const showPresenter = !slide || slide.ovl;
  let html = "";
  if (showPresenter) html += `<div class="layer">${presenterLayer(seg.cam || "M")}</div>`;
  if (slide) html += renderSlide(slide, t);
  const src = (slide && slide.src) ? slide.src : (D.extraSrc.find(x => t >= x.a && t < x.a + 3) || {}).text;
  if (src) html += `<div class="src">${esc(src)}</div>`;
  if (line){
    const cls = line.kind == "hold" ? "hold" : line.kind == "visual" ? "vis" : "";
    const txt = line.kind == "hold" ? `⏳ صمت للمشاهد — المقدم ساكت وباصص للكاميرا` : line.kind == "visual" ? `🎬 مقطع بصري بلا كلام` : line.text;
    html += `<div class="sub"><span class="${cls}">${esc(txt)}</span></div>`;
  }
  html += `<div class="badge"><span class="chip ${seg.pres=="ON"?"on":""}">${esc(seg.pres||"—")}</span><span class="chip">${slide?slide.id:"presenter"}</span></div>`;
  $("stage").innerHTML = html;
  $("tc").textContent = fmt(t) + " / " + fmt(D.total);
  $("scTitle").textContent = sc.title;
  $("scId").textContent = sc.id + "  (" + fmt(sc.a) + "–" + fmt(sc.b) + ")";
  $("slId").textContent = slide ? slide.id + (slide.ovl ? " (فوق المقدم)" : "") : "المقدم وحده";
  $("pres").textContent = seg.pres || "—";
  $("cam").textContent = seg.cam || "—";
  $("scrub").value = t;
  document.querySelectorAll(".scenes button").forEach(b => b.classList.toggle("cur", b.dataset.id == sc.id));
}

function tick(now){
  if (!playing) return;
  if (last != null) t += (now - last) / 1000 * +$("speed").value;
  last = now;
  if (t >= D.total) { t = D.total - 0.01; setPlaying(false); }
  render();
  requestAnimationFrame(tick);
}
function setPlaying(p){
  playing = p; last = null;
  $("play").textContent = p ? "❚❚ إيقاف" : "▶ تشغيل";
  if (p) requestAnimationFrame(tick);
}

function init(){
  $("scrub").max = D.total;
  const pal = ["#2c3a45","#3a4a56"];
  $("bands").innerHTML = D.scenes.map((s,i)=>`<i title="${s.id}" style="width:${(s.b-s.a)/D.total*100}%;background:${s.id=="E1-08"?"#7d3440":pal[i%2]}"></i>`).join("");
  $("scenes").innerHTML = D.scenes.map(s=>`<button type="button" data-id="${s.id}" data-a="${s.a}"><b>${s.id} · ${fmt(s.a)}</b><span>${esc(s.title)}</span></button>`).join("");
  $("scenes").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ t = +b.dataset.a + 0.01; render(); } });
  $("play").addEventListener("click", () => setPlaying(!playing));
  $("scrub").addEventListener("input", e => { t = +e.target.value; render(); });
  document.addEventListener("keydown", e => { if (e.code == "Space" && e.target.tagName != "SELECT" && e.target.tagName != "BUTTON"){ e.preventDefault(); setPlaying(!playing); } });
  render();
}
init();
</script>
